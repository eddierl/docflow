services:

  postgres:
    image: postgres:16
    container_name: docflow-postgres
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  floci:
    image: floci/floci:latest
    container_name: docflow-floci
    ports:
      - "4566:4566"
      - "5100:5100" # container registry used for ECS worker images
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


volumes:

  postgres_data: