services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: docflow-postgres
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  floci:
    image: floci/floci:2
    container_name: docflow-floci
    ports:
      - "4566:4566"


  # ---------------------------------------------------------------------------
  # Application Services (built from Dockerfiles)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docflow-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://docflow:docflow@postgres:5432/docflow
      S3_BUCKET: docflow-uploads
      SQS_QUEUE_URL: http://floci:4566/000000000000/docflow-document-processing
      AWS_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: docflow-worker
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://docflow:docflow@postgres:5432/docflow
      S3_BUCKET: docflow-uploads
      SQS_QUEUE_URL: http://floci:4566/000000000000/docflow-document-processing
      AWS_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started

  outbox-worker:
    build:
      context: .
      dockerfile: apps/outbox-worker/Dockerfile
    container_name: docflow-outbox-worker
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://docflow:docflow@postgres:5432/docflow
      SQS_QUEUE_URL: http://floci:4566/000000000000/docflow-document-processing
      AWS_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started


volumes:
  postgres_data:
